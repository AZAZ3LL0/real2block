[project]
name = "real2block"
version = "0.1.0"
description = "Photo to Minecraft skin to papercraft PDF"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "python-multipart",
    "pydantic>=2",
    "pydantic-settings",
    "pillow",
    "numpy",
    "opencv-python-headless",
    "reportlab",
]

[dependency-groups]
dev = [
    "pytest",
    "hypothesis",
    "pypdf",
    "ruff",
    "mypy",
    "pip-audit",
    "httpx2>=2.13.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/real2block"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM", "RUF", "C90", "PL", "PT", "BLE", "S"]
ignore = ["PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["cv2", "cv2.*", "reportlab", "reportlab.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
