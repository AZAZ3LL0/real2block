name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy --strict src
      - run: uv run pytest -q
      - run: uv run pip-audit --skip-editable

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint .
      - run: npx vitest run
      # Dev-only advisories (Tailwind 3 -> braces) have no fix; see the PR notes.
      - run: npm audit --audit-level=high --omit=dev

  contract-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --frozen --no-dev
        working-directory: backend
      # Run from the venv, not `uv run`: a live uv process holds the cache lock
      # and makes setup-uv's post-job cache prune time out.
      - name: Start API
        working-directory: backend
        run: |
          .venv/bin/uvicorn real2block.main:app_factory --factory --port 8000 &
          echo $! > "$RUNNER_TEMP/api.pid"
          for _ in $(seq 1 30); do curl -fs localhost:8000/api/v1/healthz && exit 0; sleep 1; done
          exit 1
      - run: npm ci
        working-directory: frontend
      - run: npm run gen:api
        working-directory: frontend
      - run: git diff --exit-code frontend/src/api/schema.d.ts
      - name: Stop API
        if: always()
        run: kill "$(cat "$RUNNER_TEMP/api.pid")" 2>/dev/null || true

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker compose -f docker/compose.yml --profile dev build
